name: CliQr Technologies *
description: 'CliQr Technologies was a San Jose, California cloud management software company, backed by
  GV (Google Ventures) and Google Capital, that built the CloudCenter platform for application-defined
  hybrid cloud orchestration. Its single application profile let enterprises model, deploy, and manage
  workloads across bare-metal, virtualized, and container environments and across public clouds (AWS,
  Microsoft Azure, Google Cloud, IBM SoftLayer, Rackspace) and private clouds (OpenStack, CloudStack,
  VMware vCloud). Cisco announced its intent to acquire CliQr for $260 million in March 2016 and folded
  the product into Cisco CloudCenter as part of its hybrid cloud strategy; CliQr no longer operates as an
  independent company and maintains no active developer surface, API, or documentation.'
